name: Production CI/CD

on:
  push:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Use Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'
      - name: Install dependencies
        run: |
          cd frontend && npm ci
          cd ../backend && npm ci
      - name: Lint and Typecheck
        run: |
          cd frontend && npm run build
          cd ../backend && npx tsc --noEmit
      - name: Run Tests
        run: |
          cd backend && npx jest

  docker-build-push:
    needs: build-and-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Login to DockerHub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Build and push Backend
        uses: docker/build-push-action@v4
        with:
          context: ./backend
          push: true
          tags: myorg/telecom-backend:${{ github.sha }}
      - name: Build and push AI
        uses: docker/build-push-action@v4
        with:
          context: ./ai
          push: true
          tags: myorg/telecom-ai:${{ github.sha }}

  deploy-k8s:
    needs: docker-build-push
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Update Kubernetes Deployments
        run: |
          # Apply migrations using a one-off job before rolling out
          kubectl apply -f deploy/k8s/base/migration-job.yaml
          kubectl wait --for=condition=complete job/prisma-migrate
          
          # Rollout new image
          kubectl set image deployment/telecom-backend backend=myorg/telecom-backend:${{ github.sha }}
          kubectl set image deployment/telecom-ai ai=myorg/telecom-ai:${{ github.sha }}
          
          # Watch rollout status
          kubectl rollout status deployment/telecom-backend --timeout=300s
