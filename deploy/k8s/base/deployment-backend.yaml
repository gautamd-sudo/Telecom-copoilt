apiVersion: apps/v1
kind: Deployment
metadata:
  name: telecom-backend
spec:
  replicas: 3
  selector:
    matchLabels:
      app: telecom-backend
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: telecom-backend
    spec:
      containers:
      - name: backend
        image: telecom-backend:latest
        ports:
        - containerPort: 3001
        envFrom:
        - configMapRef:
            name: telecom-config
        - secretRef:
            name: telecom-secrets
        resources:
          requests:
            cpu: "250m"
            memory: "512Mi"
          limits:
            cpu: "1000m"
            memory: "1Gi"
        livenessProbe:
          httpGet:
            path: /health/live
            port: 3001
          initialDelaySeconds: 15
          periodSeconds: 20
        readinessProbe:
          httpGet:
            path: /health/ready
            port: 3001
          initialDelaySeconds: 5
          periodSeconds: 10
