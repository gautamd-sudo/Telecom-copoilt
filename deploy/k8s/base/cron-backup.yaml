apiVersion: batch/v1
kind: CronJob
metadata:
  name: pg-backup
spec:
  schedule: "0 2 * * *" # Daily at 2 AM
  jobTemplate:
    spec:
      template:
        spec:
          containers:
          - name: pg-dump
            image: postgres:15-alpine
            env:
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef:
                  name: telecom-secrets
                  key: DB_PASSWORD
            command:
            - /bin/sh
            - -c
            - "pg_dump -h db-service -U postgres telecom_ai | gzip > /backups/telecom_ai_$(date +\\%Y\\%m\\%d).sql.gz"
            volumeMounts:
            - name: backup-storage
              mountPath: /backups
          restartPolicy: OnFailure
          volumes:
          - name: backup-storage
            persistentVolumeClaim:
              claimName: backup-pvc
